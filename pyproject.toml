[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-sentinel"
version = "0.1.0"
description = "Self-healing supervisor for GPU/CPU inference workers: health probes, outlier detection, backoff-restart recovery, request routing, and an audit log."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fahad Nafees" }]
keywords = ["reliability", "sre", "inference", "gpu", "monitoring", "self-healing", "fault-injection"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "aiohttp>=3.9,<4",
  "psutil>=5.9",
  "numpy>=1.24",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.2",
  "ruff>=0.4",
  "mypy>=1.8",
]

[project.scripts]
sentinel = "sentinel.__main__:main"

[tool.setuptools.packages.find]
include = ["sentinel*", "bench*"]

[tool.setuptools.package-data]
"sentinel.controller" = ["dashboard.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
markers = [
  "integration: spawns real worker processes (slower)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "B008", "SIM108", "SIM105"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
