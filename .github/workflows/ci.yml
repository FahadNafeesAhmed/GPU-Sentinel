name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + types + tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy sentinel
      - name: unit tests
        run: pytest tests/unit -q
      - name: fault-injection integration tests
        run: pytest tests/integration -q --timeout=180
        env:
          SENTINEL_TEST_LOG: INFO
      - name: quick benchmark smoke
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m sentinel bench --quick --scenarios crash_sigkill,hang,baseline --rps 50 --out /tmp/bench
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        with:
          name: bench-quick
          path: /tmp/bench
          if-no-files-found: ignore

  docker:
    name: docker compose smoke (kill a container, watch it heal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: bash scripts/compose_smoke.sh
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - run: docker compose down -v
        if: always()
